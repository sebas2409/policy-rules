name: Release

# Publishes the artifact to Maven Central and creates the tag from the version
# in the pom.
#
# Flow: change <version> in pom.xml and merge it into main. This workflow reads
# that version, publishes the signed artifact to Central, creates the vX.Y.Z tag
# and opens the release with the jars attached.
#
# A -SNAPSHOT version, or one whose tag already exists, publishes nothing.
#
# Requires four secrets (see docs/publishing.md):
#   CENTRAL_USERNAME, CENTRAL_TOKEN  Central Portal credentials
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE  key the artifacts are signed with
on:
  push:
    branches: [ main ]
    paths: [ 'pom.xml' ]
  workflow_dispatch:

permissions:
  contents: write   # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish and tag
    runs-on: ubuntu-latest

    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out the repository with its history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Without credentials nothing can be signed or uploaded, so this is
      # checked before anything is set up. It happens here rather than in the
      # publish step to avoid importing an empty GPG key.
      - name: Check the Maven Central credentials
        id: secrets
        run: |
          missing=""
          for name in CENTRAL_USERNAME CENTRAL_TOKEN GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            reason="Missing secrets:$missing. Set them up following docs/publishing.md."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$reason"
              exit 1
            fi
            echo "::warning::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25, the GPG key and the Central credentials
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Read the version from the pom
        id: pom
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version in the pom: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether the version is publishable
        id: gate
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.pom.outputs.version }}
          TAG: ${{ steps.pom.outputs.tag }}
        run: |
          reason=""
          if [ "${VERSION%-SNAPSHOT}" != "$VERSION" ]; then
            reason="Version $VERSION is a SNAPSHOT: bump the version in the pom to publish."
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            reason="Tag $TAG already exists: version $VERSION is already published."
          fi

          if [ -n "$reason" ]; then
            # A manual run expects a publication, so this is a failure.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$reason"
              exit 1
            fi
            echo "::notice::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Compiles, runs the tests, builds sources and Javadoc, signs everything
      # with GPG and uploads it to Central. With autoPublish the artifact is
      # published without visiting the portal, and this step waits for the
      # outcome: if Central rejects it, no tag is created.
      - name: Publish to Maven Central
        if: steps.gate.outputs.publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease,central deploy

      - name: Create the version tag
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.pom.outputs.version }}
          TAG: ${{ steps.pom.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "policy-rules $VERSION"
          git push origin "$TAG"

      - name: Publish the release with the jars attached
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pom.outputs.version }}
          TAG: ${{ steps.pom.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "policy-rules $VERSION" \
            --generate-notes \
            target/policy-rules-"$VERSION".jar \
            target/policy-rules-"$VERSION"-sources.jar \
            target/policy-rules-"$VERSION"-javadoc.jar
          echo "Published release [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
