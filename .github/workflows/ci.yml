name: CI

# Verifies every change before it reaches main. Publishes nothing.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and Javadoc
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The release profile also builds the sources and Javadoc jars, so
      # incomplete documentation breaks the build here and not at publish time.
      - name: Verify
        run: mvn -B -Prelease verify
