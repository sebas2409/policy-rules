name: Release

# Publica el paquete en Maven Central y crea el tag a partir de la versión
# del pom.
#
# Flujo: se cambia <version> en pom.xml y se mergea a main. Este workflow lee
# esa versión, publica el artefacto firmado en Central, crea el tag vX.Y.Z y
# abre la release con los jar adjuntos.
#
# Una versión -SNAPSHOT, o una cuyo tag ya existe, no publica nada.
#
# Requiere cuatro secretos (ver docs/publicacion.md):
#   CENTRAL_USERNAME, CENTRAL_TOKEN  credenciales del Central Portal
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE  clave con la que se firman los artefactos
on:
  push:
    branches: [ main ]
    paths: [ 'pom.xml' ]
  workflow_dispatch:

permissions:
  contents: write   # crear el tag y la release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publicar y etiquetar
    runs-on: ubuntu-latest

    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Descargar el repositorio con su historial y sus tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sin credenciales no se puede firmar ni subir, así que se comprueba
      # antes de preparar nada. Se hace aquí y no en el paso de publicación
      # para no llegar a importar una clave GPG vacía.
      - name: Comprobar las credenciales de Maven Central
        id: secrets
        run: |
          missing=""
          for name in CENTRAL_USERNAME CENTRAL_TOKEN GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            reason="Faltan secretos:$missing. Configúralos siguiendo docs/publicacion.md."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$reason"
              exit 1
            fi
            echo "::warning::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Java 25, la clave GPG y las credenciales de Central
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Leer la versión del pom
        id: pom
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Versión del pom: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Decidir si la versión es publicable
        id: gate
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.pom.outputs.version }}
          TAG: ${{ steps.pom.outputs.tag }}
        run: |
          reason=""
          if [ "${VERSION%-SNAPSHOT}" != "$VERSION" ]; then
            reason="La versión $VERSION es un SNAPSHOT: sube la versión del pom para publicar."
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            reason="El tag $TAG ya existe: la versión $VERSION ya está publicada."
          fi

          if [ -n "$reason" ]; then
            # Lanzado a mano se espera una publicación, así que es un fallo.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$reason"
              exit 1
            fi
            echo "::notice::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Compila, pasa los tests, genera fuentes y JavaDoc, firma todo con GPG
      # y lo sube a Central. Con autoPublish el artefacto queda publicado sin
      # pasar por el portal, y el paso espera al resultado: si Central lo
      # rechaza, no se crea el tag.
      - name: Publicar en Maven Central
        if: steps.gate.outputs.publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease,central deploy

      - name: Crear el tag de la versión
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.pom.outputs.version }}
          TAG: ${{ steps.pom.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "policy-rules $VERSION"
          git push origin "$TAG"

      - name: Publicar la release con los jar adjuntos
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pom.outputs.version }}
          TAG: ${{ steps.pom.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "policy-rules $VERSION" \
            --generate-notes \
            target/policy-rules-"$VERSION".jar \
            target/policy-rules-"$VERSION"-sources.jar \
            target/policy-rules-"$VERSION"-javadoc.jar
          echo "Publicada la release [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
